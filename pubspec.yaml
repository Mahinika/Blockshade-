name: blockshade
description: "Blockshade - A mobile block puzzle with the shadow block twist"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State management
  provider: ^6.1.2
  
  # Local storage
  shared_preferences: ^2.3.3
  
  # Ads (AdMob)
  google_mobile_ads: ^5.3.1
  
  # In-app purchases
  in_app_purchase: ^3.2.0
  
  # Analytics
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.6
  
  # Remote config
  firebase_remote_config: ^5.1.6
  
  # Audio (for sound effects)
  audioplayers: ^6.1.0
  
  # UUID for unique IDs
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
    - family: Recursive
      fonts:
        - asset: assets/fonts/Recursive-Variable.ttf
  
  assets:
    - assets/levels/
    - assets/sounds/
