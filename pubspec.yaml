name: blockshade
description: "Blockshade - A mobile block puzzle with the shadow block twist"
publish_to: 'none'
version: 1.0.0-test9+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State management
  provider: ^6.1.2
  
  # Local storage
  shared_preferences: ^2.3.3
  
  # Ads (AdMob)
  # 9.x bundles Google Mobile Ads SDK 25 (v24+). 5.3.1 / GMA v23 sunsets 2027-06-30.
  # 9.1.0 is the newest release on pub.dev (GMA Android 25.4.0, UMP 4.0.0).
  google_mobile_ads: ^9.1.0
  
  # In-app purchases
  in_app_purchase: ^3.2.0
  
  # Analytics
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.6
  
  # Remote config
  firebase_remote_config: ^5.1.6
  
  # Audio (for sound effects)
  audioplayers: ^6.1.0
  
  # UUID for unique IDs
  uuid: ^4.5.1

  # Opens the privacy policy from settings and the consent screen
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
    - family: Recursive
      fonts:
        - asset: assets/fonts/Recursive-Variable.ttf
  
  assets:
    - assets/levels/
    - assets/sounds/
    - config/admob.json
